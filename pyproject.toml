
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claw"
dynamic = ["version"]
description = "A programming language that compiles to the Scratch .sb3 format."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
claw = "claw.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "calver-by-date"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]
